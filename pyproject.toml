[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2-leakage"
version = "0.1.0"
description = "Frozen computational analysis for recording-quality variation and clinical speech inference in ALS"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib",
  "matplotlib",
  "numpy",
  "pandas",
  "pyarrow",
  "pyyaml",
  "scikit-learn",
  "scipy",
  "statsmodels",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
notebooks = [
  "ipykernel",
  "jupyterlab",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
